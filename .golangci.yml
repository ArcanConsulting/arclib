version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    # Bugs
    - bodyclose
    - nilerr
    - nilnil
    - sqlclosecheck

    # Performance
    - prealloc

    # Security
    - gosec

    # Complexity
    - gocyclo
    - gocognit

    # Best practices
    - gocritic
    - revive
    - unconvert
    - misspell

  settings:
    gocyclo:
      min-complexity: 15

    gocognit:
      min-complexity: 20

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam

    gosec:
      excludes:
        - G104

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
        - name: var-naming

    misspell:
      locale: US

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gocyclo
          - gocognit

      - path: _test\.go
        linters:
          - revive
        text: "dot-imports"
